{% extends "core/base.html" %}

{% block title %}Register - Phoenix Video Rental{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1>Create an Account</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Register
            </button>
        </form>

        <p class="mt-3">
            Already have an account?
            <a href="{% url 'login' %}">Log in</a>
        </p>

        <p>
            <a href="{% url 'core:home' %}">Return home</a>
        </p>
    </div>
</div>
{% endblock %}
